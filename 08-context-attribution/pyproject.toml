[project]
name = "xai08-context-attribution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.50",
    "scikit-learn>=1.6",
    "numpy>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
